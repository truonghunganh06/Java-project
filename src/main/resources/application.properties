server.port=8080

# Cấu hình chuẩn kết nối Neon PostgreSQL (Pooler Mode)
spring.datasource.url=jdbc:postgresql://ep-crimson-darkness-azvyzksi-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_BuN3rckyjlT0
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=true

# HikariCP Configuration (Tối ưu kết nối Neon Pooler)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=15000

# Bật nén HTTP GZIP (giảm dung lượng HTML/JSON/CSS/JS truyền qua mạng từ 70-80%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=512

# Cấu hình cache cho tài nguyên tĩnh và trình duyệt
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.period=86400
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# Giới hạn dung lượng upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Cấu hình Google OAuth 2.0 (Đăng nhập Email Sinh viên)
google.oauth2.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
google.oauth2.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
app.auth.student-email-domains=

# Thymeleaf Live Reload (Đọc trực tiếp từ ổ đĩa file:src/... để mỗi khi sửa HTML chỉ cần F5 là nhận ngay, không cần restart server)
spring.thymeleaf.prefix=${SPRING_THYMELEAF_PREFIX:file:src/main/resources/templates/}
spring.thymeleaf.cache=false
spring.web.resources.static-locations=${SPRING_STATIC_LOCATIONS:file:src/main/resources/static/,classpath:/static/}

