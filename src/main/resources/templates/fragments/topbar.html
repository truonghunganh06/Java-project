<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>
    <div th:fragment="topbar(pageTitle, breadcrumbParent, breadcrumbParentUrl, user)" class="saas-header-group">
        <!-- 1. Global Quick Role Switcher Banner for Dev/Testing -->
        <div th:replace="~{fragments/role_switcher :: roleSwitcher(${user})}"></div>

        <!-- 2. Main Topbar Navbar -->
        <header class="saas-topbar px-4 d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <!-- Laptop / Desktop Toggle Button -->
                <button class="btn btn-sm btn-light border border-slate-200/80 rounded-full d-none d-lg-inline-flex align-items-center justify-content-center" 
                        type="button" 
                        onclick="toggleDesktopSidebar()" 
                        id="desktopSidebarToggleBtn" 
                        title="Ẩn/Hiện thanh menu (Sidebar)"
                        aria-label="Thu gọn hoặc mở rộng Sidebar"
                        style="width: 38px; height: 38px; padding: 0; flex-shrink: 0; transition: all 0.2s ease;">
                    <i class="fa-solid fa-bars-staggered text-slate-500" id="desktopSidebarToggleIcon" style="font-size: 0.9rem;"></i>
                </button>

                <!-- Mobile Toggle -->
                <button class="btn btn-sm btn-light border border-slate-200/80 d-lg-none rounded-full" type="button" onclick="toggleSidebar()" aria-label="Toggle navigation" style="width: 38px; height: 38px;">
                    <i class="fa-solid fa-bars text-slate-600"></i>
                </button>

                <!-- WellNest Pill Search Bar -->
                <div class="position-relative d-none d-sm-block" style="width: 280px; max-width: 100%;">
                    <i class="fa-solid fa-magnifying-glass position-absolute text-slate-400" style="left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.85rem;"></i>
                    <input type="text" 
                           class="form-control form-control-sm border-0 bg-slate-100/90 text-slate-800 rounded-full ps-5 pe-3 py-2 text-xs placeholder-slate-400 focus:bg-white focus:ring-2 focus:ring-teal-400 focus:shadow-xs transition" 
                           placeholder="Tìm kiếm nhanh hệ thống..." 
                           style="height: 38px;">
                </div>

                <!-- Breadcrumbs (D-none on very small screens) -->
                <nav aria-label="breadcrumb" class="d-none d-xl-block ms-2">
                    <ol class="breadcrumb topbar-breadcrumb mb-0">
                        <li class="breadcrumb-item">
                            <a th:href="@{${user != null && user.role != null ? (user.role.code == 'ADMIN' ? '/admin/dashboard' : (user.role.code == 'DEPARTMENT_HEAD' || user.role.code == 'DIVISION_HEAD' ? '/department-head/dashboard' : (user.role.code == 'LECTURER' ? '/lecturer/dashboard' : '/student/dashboard'))) : '/login'}}">
                                <i class="fa-solid fa-house text-slate-400 me-1" style="font-size: 0.8rem;"></i> Trang chủ
                            </a>
                        </li>
                        <li class="breadcrumb-item" th:if="${breadcrumbParent != null}">
                            <a th:href="@{${breadcrumbParentUrl != null ? breadcrumbParentUrl : '#'}}" th:text="${breadcrumbParent}">Quản lý</a>
                        </li>
                        <li class="breadcrumb-item active text-slate-900 font-bold" aria-current="page" th:text="${pageTitle != null ? pageTitle : 'Bảng điều khiển'}">Bảng điều khiển</li>
                    </ol>
                </nav>
            </div>

            <!-- Topbar Right Actions -->
            <div class="d-flex align-items-center gap-2.5">
                
                <!-- Academic Session Pill Tag -->
                <div class="d-none d-md-flex align-items-center gap-2 px-3.5 py-1.5 bg-teal-50/80 border border-teal-200/60 rounded-full" style="font-size: 0.8rem;">
                    <i class="fa-regular fa-calendar text-teal-600"></i>
                    <span class="text-teal-700 font-medium">Học kỳ:</span>
                    <strong class="text-teal-950 font-bold">HK1 2026-2027</strong>
                </div>

                <!-- Dark / Light Mode Toggle Button -->
                <button class="btn btn-sm btn-light border border-slate-200/80 rounded-full d-flex align-items-center justify-content-center text-slate-500 hover:text-slate-800" 
                        id="themeToggleBtn"
                        type="button" 
                        onclick="toggleTheme()" 
                        style="width: 38px; height: 38px;" 
                        title="Chuyển đổi Sáng / Tối">
                    <i class="fa-regular fa-moon" id="themeToggleIcon"></i>
                </button>

                <!-- Notifications Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-sm btn-light border border-slate-200/80 rounded-full position-relative d-flex align-items-center justify-content-center text-slate-500 hover:text-slate-800" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="width: 38px; height: 38px;" title="Thông báo hệ thống">
                        <i class="fa-regular fa-bell"></i>
                        <!-- Notification Counter Badge -->
                        <span th:if="${announcements != null && !announcements.isEmpty()}" 
                              class="position-absolute -top-1 -end-1 badge rounded-full bg-rose-500 text-white d-flex align-items-center justify-content-center shadow-xs" 
                              id="topbarNotificationCount"
                              style="font-size: 0.65rem; min-width: 18px; height: 18px; padding: 0 4px; border: 2px solid #ffffff; z-index: 2;"
                              th:text="${#lists.size(announcements) > 9 ? '9+' : #lists.size(announcements)}">1</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end shadow-wellnest-lg border border-slate-100 rounded-3xl p-0 mt-2" style="width: 340px; z-index: 1050;">
                        <div class="p-3.5 border-b border-slate-100 bg-slate-50/70 rounded-t-3xl d-flex align-items-center justify-content-between">
                            <div class="d-flex align-items-center gap-2">
                                <span class="fw-bold text-slate-900 text-sm">Thông báo</span>
                                <span class="badge bg-teal-100 text-teal-800 font-bold rounded-full px-2 py-0.5 text-xs" 
                                      id="topbarNotificationHeaderCount"
                                      th:if="${announcements != null && !announcements.isEmpty()}"
                                      th:text="${#lists.size(announcements)} + ' mới'">1 mới</span>
                            </div>
                            <button type="button" class="btn btn-link p-0 text-xs text-teal-600 text-decoration-none hover:underline font-semibold" 
                                     onclick="markAllAnnouncementsAsRead()" 
                                     th:if="${announcements != null && !announcements.isEmpty()}">
                                Đã đọc tất cả
                            </button>
                        </div>
                        <div class="p-2 divide-y divide-slate-100" style="max-height: 320px; overflow-y: auto;">
                            <th:block th:if="${announcements != null && !announcements.isEmpty()}">
                                <div class="p-2.5 rounded-2xl hover:bg-slate-50 transition cursor-pointer d-flex gap-2.5 align-items-start position-relative notification-item-track"
                                     th:each="a, aStat : ${announcements}" th:if="${aStat.index < 6}"
                                     onclick="showAnnouncementDetail(this)"
                                     th:data-announcement-id="${a.id}"
                                     th:data-title="${a.title}"
                                     th:data-category="${a.category != null ? a.category : 'THÔNG BÁO'}"
                                     th:data-author="${a.author != null ? a.author.fullName : 'Ban chủ nhiệm Khoa'}"
                                     th:data-created-at="${a.createdAt != null ? #temporals.format(a.createdAt, 'dd/MM/yyyy HH:mm') : ''}"
                                     th:data-period="${a.period != null ? a.period.name : ''}"
                                     th:data-content="${a.content}">
                                    <div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center flex-shrink-0 mt-0.5">
                                        <i class="fa-solid fa-bullhorn text-xs"></i>
                                    </div>
                                    <div class="text-xs overflow-hidden flex-grow-1">
                                        <p class="mb-0.5 fw-semibold text-slate-800 text-truncate" th:text="${a.title}">Tiêu đề thông báo</p>
                                        <span class="text-slate-400" th:text="${a.createdAt != null ? #temporals.format(a.createdAt, 'dd/MM/yyyy') : 'Hôm nay'}">Hôm nay</span>
                                    </div>
                                    <span class="unread-dot w-2 h-2 rounded-full bg-teal-500 flex-shrink-0 mt-1.5" title="Chưa đọc"></span>
                                </div>
                            </th:block>
                            <div th:if="${announcements == null || announcements.isEmpty()}" class="p-4 text-center text-slate-400 text-xs">
                                <i class="fa-regular fa-bell-slash text-xl mb-1 d-block opacity-40"></i>
                                Chưa có thông báo mới nào.
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Minimalist User Avatar Button -->
                <div class="dropdown">
                    <button class="btn p-0 border border-slate-200/80 rounded-full d-flex align-items-center justify-content-center bg-white hover:bg-slate-50 transition shadow-2xs" 
                            type="button" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false" 
                            style="width: 38px; height: 38px;" 
                            title="Tài khoản cá nhân">
                        <div class="rounded-full bg-slate-900 text-teal-300 d-flex align-items-center justify-content-center fw-bold" style="width: 32px; height: 32px; font-size: 0.85rem;">
                            <span th:text="${user != null && user.fullName != null && user.fullName.length() > 0 ? user.fullName.substring(0, 1) : 'U'}">U</span>
                        </div>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-wellnest-lg border border-slate-100 rounded-3xl p-1.5 mt-2" style="min-width: 220px;">
                        <li class="px-3.5 py-2.5 border-b border-slate-100 mb-1">
                            <p class="mb-0 fw-bold text-slate-900 text-sm" th:text="${user != null ? user.fullName : 'Tài khoản'}">Họ Tên</p>
                            <p class="mb-0 text-slate-400 text-xs" th:text="${user != null && user.role != null ? user.role.name : 'Vai trò'}">Trưởng bộ môn</p>
                        </li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2 py-2 px-3 rounded-2xl text-xs font-semibold text-slate-700 hover:bg-teal-50 hover:text-teal-900" th:href="@{${user != null && user.role != null ? (user.role.code == 'ADMIN' ? '/admin/dashboard' : (user.role.code == 'DEPARTMENT_HEAD' || user.role.code == 'DIVISION_HEAD' ? '/department-head/dashboard' : (user.role.code == 'LECTURER' ? '/lecturer/dashboard' : '/student/dashboard'))) : '/login'}}">
                                <i class="fa-solid fa-chart-pie text-slate-400"></i>
                                <span>Bảng điều khiển</span>
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1 border-slate-100"></li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2 py-2 px-3 rounded-2xl text-xs font-semibold text-rose-600 hover:bg-rose-50" th:href="@{/logout}">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                                <span>Đăng xuất</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
