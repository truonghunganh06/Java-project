<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<body>
    <div th:fragment="scripts">
        <!-- Global Announcement Detail Modal (Available across all pages) -->
        <div class="modal fade" id="announcementDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content rounded-2xl border-0 shadow-xl">
                    <div class="modal-header border-b border-slate-100 p-4">
                        <div class="d-flex align-items-center gap-2">
                            <div
                                class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 d-flex align-items-center justify-content-center flex-shrink-0">
                                <i class="fa-solid fa-bullhorn text-sm"></i>
                            </div>
                            <div>
                                <span id="modalAnnouncementCategory"
                                    class="badge-pill-neutral font-semibold text-xs text-blue-700 bg-blue-50 border-blue-200 mb-0.5 d-inline-block">Thông
                                    báo chung</span>
                                <h6 id="modalAnnouncementTitle"
                                    class="modal-title font-bold text-slate-900 text-sm mb-0">Tiêu đề thông báo</h6>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4 space-y-3">
                        <div
                            class="d-flex align-items-center justify-content-between text-xs text-slate-400 pb-2 border-b border-slate-100">
                            <div><i class="fa-solid fa-user-pen me-1"></i> Người đăng: <strong
                                    id="modalAnnouncementAuthor" class="text-slate-700">Ban chủ nhiệm Khoa</strong>
                            </div>
                            <div><i class="fa-regular fa-clock me-1"></i> <span id="modalAnnouncementTime">--</span>
                            </div>
                        </div>
                        <div id="modalAnnouncementPeriodWrap"
                            class="p-2.5 bg-blue-50/50 rounded-xl border border-blue-100 text-xs text-blue-800 d-none">
                            <i class="fa-solid fa-bookmark me-1.5 text-blue-600"></i> Áp dụng cho: <strong
                                id="modalAnnouncementPeriod">Đợt KLTN</strong>
                        </div>
                        <div id="modalAnnouncementContent"
                            class="text-xs text-slate-700 leading-relaxed p-3 bg-slate-50/70 rounded-xl border border-slate-100"
                            style="white-space: pre-line; min-height: 120px;">
                            Nội dung chi tiết thông báo...
                        </div>
                    </div>
                    <div class="modal-footer border-t border-slate-100 p-3">
                        <button type="button" class="btn btn-sm btn-light border rounded-xl px-4 text-xs font-semibold"
                            data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Toast Container (Fixed top-right) -->
        <div class="saas-toast-container" id="saasToastContainer"></div>

        <!-- Global Floating AI Assistant Widget -->
        <div th:replace="~{fragments/ai_chat :: aiChatWidget}"></div>

        <!-- Global Confirmation Modal (Replaces browser default confirm dialogs) -->
        <div class="modal fade saas-confirm-modal" id="globalConfirmModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" style="max-width: 420px;">
                <div class="modal-content text-center p-4">
                    <div class="d-flex justify-content-center">
                        <div class="saas-confirm-icon-wrap primary" id="confirmModalIconWrap">
                            <i class="fa-solid fa-circle-question" id="confirmModalIcon"></i>
                        </div>
                    </div>
                    <h5 class="modal-title fw-bold text-slate-900 text-base mb-1" id="confirmModalTitle">Xác nhận thao
                        tác</h5>
                    <p class="text-xs text-slate-500 mb-4" id="confirmModalMessage">Bạn có chắc chắn muốn thực hiện hành
                        động này?</p>
                    <div class="d-flex gap-2">
                        <button type="button"
                            class="btn btn-sm btn-light border rounded-xl flex-grow-1 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100"
                            data-bs-dismiss="modal" id="confirmModalCancelBtn">Hủy</button>
                        <button type="button"
                            class="btn btn-sm btn-primary rounded-xl flex-grow-1 py-2 text-xs font-semibold shadow-sm"
                            id="confirmModalAcceptBtn">Xác nhận</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap 5.3 JS Bundle -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Chart.js 4.4.2 -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

        <script>
            // Robust Unicode String Decoder (fixes any \uXXXX or \xXX escape artifacts)
            function decodeUnicode(str) {
                if (!str || typeof str !== 'string') return str || '';
                try {
                    if (/\\u[0-9a-fA-F]{4}|\\x[0-9a-fA-F]{2}/.test(str)) {
                        return JSON.parse('"' + str.replace(/"/g, '\\"') + '"');
                    }
                } catch (e) {
                    try {
                        return decodeURIComponent(escape(str));
                    } catch (e2) { }
                }
                return str;
            }

            function closeSelectMenus(except) {
                document.querySelectorAll('.custom-select-wrap.is-open').forEach(function (wrap) {
                    if (wrap !== except) {
                        wrap.classList.remove('is-open');
                        const trigger = wrap.querySelector('.custom-select-trigger');
                        if (trigger) trigger.setAttribute('aria-expanded', 'false');
                    }
                });
            }

            function createCustomSelect(select) {
                if (select.dataset.customSelect === 'true' || select.disabled) return;

                const hasPeriodInUrl = new URLSearchParams(window.location.search).has('periodId');
                if (select.name === 'periodId' && !hasPeriodInUrl && select.querySelector('option[value=""]')) {
                    select.value = '';
                }

                const wrap = document.createElement('div');
                wrap.className = 'custom-select-wrap';
                wrap.style.width = select.style.width || '100%';
                select.parentNode.insertBefore(wrap, select);
                wrap.appendChild(select);
                select.classList.add('custom-select-source');
                select.dataset.customSelect = 'true';

                const trigger = document.createElement('button');
                trigger.type = 'button';
                trigger.className = 'custom-select-trigger';
                trigger.setAttribute('aria-haspopup', 'listbox');
                trigger.setAttribute('aria-expanded', 'false');
                wrap.appendChild(trigger);

                const menu = document.createElement('ul');
                menu.className = 'custom-select-menu';
                menu.setAttribute('role', 'listbox');
                wrap.appendChild(menu);

                function sync() {
                    const selected = select.options[select.selectedIndex];
                    const label = selected ? selected.textContent.trim() : '';
                    trigger.textContent = label;
                    trigger.title = label;
                    menu.querySelectorAll('.custom-select-option').forEach(function (item) {
                        item.classList.toggle('is-selected', item.dataset.value === select.value);
                    });
                }

                Array.from(select.options).forEach(function (option) {
                    const item = document.createElement('li');
                    item.className = 'custom-select-option' + (!option.value ? ' is-placeholder' : '');
                    item.dataset.value = option.value;
                    item.textContent = option.textContent.trim();
                    item.setAttribute('role', 'option');
                    item.addEventListener('click', function () {
                        select.value = option.value;
                        select.dispatchEvent(new Event('change', { bubbles: true }));
                        sync();
                        wrap.classList.remove('is-open');
                        trigger.setAttribute('aria-expanded', 'false');
                    });
                    menu.appendChild(item);
                });

                trigger.addEventListener('click', function () {
                    const shouldOpen = !wrap.classList.contains('is-open');
                    closeSelectMenus(wrap);
                    wrap.classList.toggle('is-open', shouldOpen);
                    trigger.setAttribute('aria-expanded', String(shouldOpen));
                });

                select.addEventListener('change', sync);
                sync();
            }

            document.addEventListener('DOMContentLoaded', function () {
                document.querySelectorAll('select.form-select').forEach(createCustomSelect);
            });

            document.addEventListener('click', function (event) {
                if (!event.target.closest('.custom-select-wrap')) closeSelectMenus();
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') closeSelectMenus();
            });

            // Sidebar Mobile Toggle
            function toggleSidebar() {
                const sidebar = document.getElementById('saasSidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar) sidebar.classList.toggle('show');
                if (overlay) overlay.classList.toggle('show');
            }

            // Desktop / Laptop Sidebar Toggle with smooth motion
            function toggleDesktopSidebar() {
                const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
                try {
                    localStorage.setItem('topichub_sidebar_collapsed', isCollapsed ? 'true' : 'false');
                } catch (e) { }

                const icon = document.getElementById('desktopSidebarToggleIcon');
                if (icon) {
                    if (isCollapsed) {
                        icon.className = 'fa-solid fa-bars text-secondary';
                    } else {
                        icon.className = 'fa-solid fa-indent text-secondary';
                    }
                }
            }

            // Restore Desktop Sidebar collapse state on page load
            document.addEventListener('DOMContentLoaded', function () {
                try {
                    if (window.innerWidth >= 992) {
                        const savedState = localStorage.getItem('topichub_sidebar_collapsed');
                        if (savedState === 'true') {
                            document.body.classList.add('sidebar-collapsed');
                            const icon = document.getElementById('desktopSidebarToggleIcon');
                            if (icon) {
                                icon.className = 'fa-solid fa-bars text-secondary';
                            }
                        }
                    }
                } catch (e) { }
            });

            // Clean UTF-8 Topic Drawer Opener (supports ID number, DOM element, or Object)
            function openTopicDrawer(source) {
                if (!source) return;

                // Case 1: Numeric ID passed -> Fetch clean UTF-8 JSON from REST API
                if (typeof source === 'number' || (typeof source === 'string' && /^\d+$/.test(source))) {
                    fetch('/api/topics/' + source)
                        .then(res => res.json())
                        .then(data => renderTopicDrawer(data))
                        .catch(err => console.error('Error fetching topic detail:', err));
                    return;
                }

                // Case 2: DOM Element or Object passed
                let data = {};
                if (source instanceof HTMLElement) {
                    data = {
                        id: source.dataset.topicId || source.dataset.id,
                        code: source.dataset.topicCode || source.dataset.code,
                        title: source.dataset.topicTitle || source.dataset.title,
                        period: source.dataset.topicPeriod || source.dataset.period,
                        major: source.dataset.topicMajor || source.dataset.major,
                        supervisor: source.dataset.topicSupervisor || source.dataset.supervisor,
                        coSupervisor: source.dataset.topicCoSupervisor || source.dataset.coSupervisor,
                        reviewer: source.dataset.topicReviewer || source.dataset.reviewer,
                        council: source.dataset.topicCouncil || source.dataset.council,
                        maxStudents: source.dataset.topicMaxStudents || source.dataset.maxStudents,
                        status: source.dataset.topicStatus || source.dataset.status,
                        description: source.dataset.topicDescription || source.dataset.description,
                        requirements: source.dataset.topicRequirements || source.dataset.requirements,
                        groupName: source.dataset.topicGroupName || source.dataset.groupName,
                        leaderName: source.dataset.topicLeaderName || source.dataset.leaderName,
                        leaderCode: source.dataset.topicLeaderCode || source.dataset.leaderCode,
                        role: source.dataset.topicRole || source.dataset.role,
                        department: source.dataset.topicDepartment || source.dataset.department || '',
                        hasGroupTopic: source.dataset.topicHasGroup === 'true'
                    };
                } else {
                    data = source;
                }

                renderTopicDrawer(data);
            }

            function renderTopicDrawer(data) {
                if (!data) return;

                // Decode all text fields through Unicode decoder
                const code = decodeUnicode(data.code) || 'DT-N/A';
                const title = decodeUnicode(data.title) || 'Chi tiết đề tài';
                const period = decodeUnicode(data.period) || 'Chung';
                const major = decodeUnicode(data.major) || 'CNTT';
                const supervisor = decodeUnicode(data.supervisor) || 'Chưa phân công';
                const coSupervisor = decodeUnicode(data.coSupervisor) || 'Không có';
                const reviewer = decodeUnicode(data.reviewer) || 'Chưa phân công GVPB';
                const council = decodeUnicode(data.council) || 'Chưa phân hội đồng';
                const description = decodeUnicode(data.description) || 'Chưa có mô tả chi tiết.';
                const requirements = decodeUnicode(data.requirements) || 'Theo hướng dẫn của Giảng viên.';
                const groupName = decodeUnicode(data.groupName);
                const leaderName = decodeUnicode(data.leaderName);
                const leaderCode = decodeUnicode(data.leaderCode);

                const backdrop = document.getElementById('topicDrawerBackdrop');
                const panel = document.getElementById('topicDrawerPanel');

                if (document.getElementById('drawerTopicCode')) {
                    document.getElementById('drawerTopicCode').textContent = code;
                }
                if (document.getElementById('drawerTopicTitle')) {
                    document.getElementById('drawerTopicTitle').textContent = title;
                }
                if (document.getElementById('drawerTopicPeriod')) {
                    document.getElementById('drawerTopicPeriod').textContent = period;
                }
                if (document.getElementById('drawerTopicMajor')) {
                    document.getElementById('drawerTopicMajor').textContent = major;
                }
                if (document.getElementById('drawerTopicDepartment')) {
                    const dept = decodeUnicode(data.department) || '';
                    const deptEl = document.getElementById('drawerTopicDepartment');
                    deptEl.textContent = dept || '—';
                    // Làm nổi bật màu xanh nếu có tên Khoa
                    deptEl.style.color = dept ? '#1d4ed8' : '#94a3b8';
                }
                if (document.getElementById('drawerTopicSupervisor')) {
                    document.getElementById('drawerTopicSupervisor').textContent = supervisor;
                }
                if (document.getElementById('drawerTopicCoSupervisor')) {
                    document.getElementById('drawerTopicCoSupervisor').textContent = coSupervisor;
                }
                if (document.getElementById('drawerTopicReviewer')) {
                    document.getElementById('drawerTopicReviewer').textContent = reviewer;
                }
                if (document.getElementById('drawerTopicCouncil')) {
                    document.getElementById('drawerTopicCouncil').textContent = council;
                }
                if (document.getElementById('drawerTopicQuota')) {
                    document.getElementById('drawerTopicQuota').textContent = 'Tối đa ' + (data.maxStudents || 3) + ' SV';
                }
                if (document.getElementById('drawerTopicDescription')) {
                    document.getElementById('drawerTopicDescription').textContent = description;
                }
                if (document.getElementById('drawerTopicRequirements')) {
                    document.getElementById('drawerTopicRequirements').textContent = requirements;
                }

                // Status Badge
                const statusBadge = document.getElementById('drawerTopicStatusBadge');
                if (statusBadge) {
                    const status = (data.status || 'PENDING').toUpperCase();
                    if (status === 'APPROVED') {
                        statusBadge.className = 'badge-pill-approved';
                        statusBadge.innerHTML = '<i class="fa-solid fa-check"></i> Đã duyệt';
                    } else if (status === 'REJECTED') {
                        statusBadge.className = 'badge-pill-rejected';
                        statusBadge.innerHTML = '<i class="fa-solid fa-xmark"></i> Từ chối';
                    } else {
                        statusBadge.className = 'badge-pill-pending';
                        statusBadge.innerHTML = '<i class="fa-regular fa-clock"></i> Chờ duyệt';
                    }
                }

                // Rejection Alert Box
                let rejAlert = document.getElementById('drawerTopicRejectionAlert');
                const rejReason = data.rejectionReason || '';
                if (data.status === 'REJECTED' && rejReason) {
                    if (!rejAlert) {
                        const drawerBody = document.querySelector('.drawer-body');
                        if (drawerBody) {
                            rejAlert = document.createElement('div');
                            rejAlert.id = 'drawerTopicRejectionAlert';
                            rejAlert.className = 'alert alert-danger p-3 rounded-2xl mb-3 border border-rose-200 shadow-sm';
                            drawerBody.insertBefore(rejAlert, drawerBody.firstChild);
                        }
                    }
                    if (rejAlert) {
                        rejAlert.style.display = 'block';
                        rejAlert.innerHTML = `
                            <div class="fw-bold text-rose-900 text-xs mb-1"><i class="fa-solid fa-triangle-exclamation text-rose-600 me-1"></i> Lý do Trưởng khoa từ chối:</div>
                            <div class="text-rose-700 text-xs">${rejReason}</div>
                        `;
                    }
                } else if (rejAlert) {
                    rejAlert.style.display = 'none';
                }

                // Group Info
                const groupInfo = document.getElementById('drawerTopicGroupInfo');
                if (groupInfo) {
                    if (groupName) {
                        groupInfo.innerHTML = `
                            <div class="p-2.5 rounded-xl bg-blue-50/50 border border-blue-100">
                                <div class="fw-bold text-dark mb-1"><i class="fa-solid fa-users text-blue-600 me-1"></i> ${groupName}</div>
                                <div class="text-muted text-xs">Trưởng nhóm: <strong class="text-dark">${leaderName || 'Sinh viên'}</strong> (${leaderCode || ''})</div>
                            </div>
                        `;
                    } else {
                        groupInfo.innerHTML = '<span class="text-muted">Chưa có nhóm nào đăng ký đề tài này.</span>';
                    }
                }

                // Dynamic Action Buttons
                const actionContainer = document.getElementById('drawerActionButtons');
                if (actionContainer) {
                    actionContainer.innerHTML = '';
                    if ((data.role === 'DEPARTMENT_HEAD' || data.role === 'DIVISION_HEAD') && data.status === 'PENDING') {
                        actionContainer.innerHTML = `
                            <form action="/department-head/topics/${data.id}/approve" method="post" class="d-inline" onsubmit="return confirm('Xác nhận PHÊ DUYỆT đề tài này?');">
                                <button type="submit" class="btn btn-sm btn-dark rounded-xl px-3 text-xs font-semibold">
                                    <i class="fa-solid fa-check me-1"></i> Phê duyệt
                                </button>
                            </form>
                            <button type="button" class="btn btn-sm btn-outline-danger rounded-xl px-3 text-xs font-semibold" data-bs-toggle="modal" data-bs-target="#rejectModal" onclick="prepareRejectModal(${data.id}, '${title.replace(/'/g, "\\'")}')">
                                <i class="fa-solid fa-xmark me-1"></i> Từ chối
                            </button>
                        `;
                    } else if (data.role === 'LECTURER' && (data.status === 'PENDING' || data.status === 'REJECTED')) {
                        actionContainer.innerHTML = `
                            <a href="/lecturer/topics/${data.id}/edit" class="btn btn-sm btn-dark rounded-xl px-3 text-xs font-semibold">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Chỉnh sửa đề tài
                            </a>
                        `;
                    } else if (data.role === 'STUDENT' && data.status === 'APPROVED' && !data.hasGroupTopic) {
                        actionContainer.innerHTML = `
                            <form action="/student/topics/${data.id}/register" method="post" class="d-inline" onsubmit="return confirm('Xác nhận đăng ký đề tài này cho nhóm của bạn?');">
                                <button type="submit" class="btn btn-sm btn-dark rounded-xl px-3 text-xs font-semibold">
                                    <i class="fa-solid fa-bookmark me-1"></i> Đăng ký ngay
                                </button>
                            </form>
                        `;
                    }
                }

                // Show drawer
                if (backdrop) backdrop.classList.add('show');
                if (panel) panel.classList.add('show');
                document.body.style.overflow = 'hidden';
            }

            function closeTopicDrawer() {
                const backdrop = document.getElementById('topicDrawerBackdrop');
                const panel = document.getElementById('topicDrawerPanel');
                if (backdrop) backdrop.classList.remove('show');
                if (panel) panel.classList.remove('show');
                document.body.style.overflow = '';
            }

            // Close on ESC key
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') closeTopicDrawer();
            });

            // Announcement Unread / Read State Management via localStorage
            function getReadAnnouncements() {
                try {
                    const stored = localStorage.getItem('topic_hub_read_announcements');
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    return [];
                }
            }

            function markAnnouncementAsRead(id) {
                if (!id) return;
                const readList = getReadAnnouncements();
                const strId = String(id);
                if (!readList.includes(strId)) {
                    readList.push(strId);
                    try {
                        localStorage.setItem('topic_hub_read_announcements', JSON.stringify(readList));
                    } catch (e) { }
                }
                updateNotificationBadges();
            }

            function markAllAnnouncementsAsRead() {
                const items = document.querySelectorAll('[data-announcement-id]');
                const readList = getReadAnnouncements();
                items.forEach(el => {
                    const id = el.dataset.announcementId;
                    if (id && !readList.includes(String(id))) {
                        readList.push(String(id));
                    }
                });
                try {
                    localStorage.setItem('topic_hub_read_announcements', JSON.stringify(readList));
                } catch (e) { }
                updateNotificationBadges();
            }

            function updateNotificationBadges() {
                const items = document.querySelectorAll('[data-announcement-id]');
                const readList = getReadAnnouncements();
                const uniqueAnnouncements = new Set();
                const unreadAnnouncements = new Set();

                items.forEach(el => {
                    const id = el.dataset.announcementId;
                    if (id) {
                        uniqueAnnouncements.add(String(id));
                        if (readList.includes(String(id))) {
                            if (el.classList.contains('notification-item-track')) {
                                el.classList.add('opacity-60');
                                const dot = el.querySelector('.unread-dot');
                                if (dot) dot.classList.add('d-none');
                            }
                        } else {
                            unreadAnnouncements.add(String(id));
                            if (el.classList.contains('notification-item-track')) {
                                el.classList.remove('opacity-60');
                                const dot = el.querySelector('.unread-dot');
                                if (dot) dot.classList.remove('d-none');
                            }
                        }
                    }
                });

                const unreadCount = unreadAnnouncements.size;
                const badge = document.getElementById('topbarNotificationCount');
                const headerCount = document.getElementById('topbarNotificationHeaderCount');

                if (badge) {
                    if (unreadCount > 0) {
                        badge.textContent = unreadCount > 9 ? '9+' : unreadCount;
                        badge.classList.remove('d-none');
                    } else {
                        badge.classList.add('d-none');
                    }
                }

                if (headerCount) {
                    if (unreadCount > 0) {
                        headerCount.textContent = unreadCount + ' chưa đọc';
                        headerCount.className = 'badge bg-blue-100 text-blue-700 font-semibold rounded-pill px-2 py-0.5 text-xs';
                        headerCount.classList.remove('d-none');
                    } else if (uniqueAnnouncements.size > 0) {
                        headerCount.textContent = 'Đã đọc hết';
                        headerCount.className = 'badge bg-slate-100 text-slate-500 font-medium rounded-pill px-2 py-0.5 text-xs';
                    }
                }
            }

            // Global Announcement Detail Modal Opener
            function showAnnouncementDetail(element) {
                if (!element) return;
                const annId = element.dataset.announcementId;
                if (annId) {
                    markAnnouncementAsRead(annId);
                }

                const title = decodeUnicode(element.dataset.title) || 'Thông báo';
                const category = decodeUnicode(element.dataset.category) || 'Thông báo chung';
                const author = decodeUnicode(element.dataset.author) || 'Ban chủ nhiệm Khoa';
                const time = element.dataset.createdAt || '';
                const period = decodeUnicode(element.dataset.period) || '';
                const content = decodeUnicode(element.dataset.content) || 'Không có nội dung chi tiết.';

                const modalTitle = document.getElementById('modalAnnouncementTitle');
                const modalCategory = document.getElementById('modalAnnouncementCategory');
                const modalAuthor = document.getElementById('modalAnnouncementAuthor');
                const modalTime = document.getElementById('modalAnnouncementTime');
                const modalContent = document.getElementById('modalAnnouncementContent');
                const periodWrap = document.getElementById('modalAnnouncementPeriodWrap');
                const modalPeriod = document.getElementById('modalAnnouncementPeriod');

                if (modalTitle) modalTitle.textContent = title;
                if (modalCategory) modalCategory.textContent = category;
                if (modalAuthor) modalAuthor.textContent = author;
                if (modalTime) modalTime.textContent = time;
                if (modalContent) modalContent.textContent = content;

                if (periodWrap && modalPeriod) {
                    if (period && period.trim() !== '') {
                        modalPeriod.textContent = period;
                        periodWrap.classList.remove('d-none');
                    } else {
                        periodWrap.classList.add('d-none');
                    }
                }

                const modalEl = document.getElementById('announcementDetailModal');
                if (modalEl) {
                    const bsModal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    bsModal.show();
                }
            }

            document.addEventListener('DOMContentLoaded', function () {
                updateNotificationBadges();
            });

            // Segmented Control Tabs Filtering
            function filterTableByStatus(status, tabElement) {
                const tabs = document.querySelectorAll('.segmented-tab, .filter-pill-tab');
                tabs.forEach(t => t.classList.remove('active'));

                const toast = document.createElement('div');
                toast.className = 'saas-toast saas-toast-' + type;

                let iconHtml = '<i class="fa-solid fa-circle-info"></i>';
                let defaultTitle = 'Thông báo';
                if (type === 'success') {
                    iconHtml = '<i class="fa-solid fa-circle-check"></i>';

                } else if (type === 'error') {
                    iconHtml = '<i class="fa-solid fa-circle-xmark"></i>';

                    iconHtml = '<i class="fa-solid fa-triangle-exclamation"></i>';

                toast.innerHTML = `
                    <div class="saas-toast-icon">${iconHtml}</div>
                    <div class="saas-toast-body">
                        <div class="saas-toast-title">${title || defaultTitle}</div>

                    <button type="button" class="saas-toast-close" aria-label="Close">&times;</button>
                    <div class="saas-toast-progress" style="width: 100%;"></div>
                `;

                container.appendChild(toast);

                // Animate in
                requestAnimationFrame(() => {
                    toast.classList.add('show');
                    const progress = toast.querySelector('.saas-toast-progress');
                    if (progress) {
                        progress.style.transitionDuration = duration + 'ms';
                        progress.style.width = '0%';
                    }
                });

                function removeToast() {
                    toast.classList.remove('show');
                    setTimeout(() => { toast.remove(); }, 300);
                }

                const timer = setTimeout(removeToast, duration);

                const closeBtn = toast.querySelector('.saas-toast-close');
                if (closeBtn) {
                    closeBtn.onclick = function () {
                        clearTimeout(timer);
                        removeToast();
                    };
                }
            };

            // ==================== AUTO INTERCEPT FORM CONFIRMS ====================

            document.addEventListener('submit', function (e) {
                const form = e.target;
                if (!form || form._isConfirmed) return;

                const onsubmitAttr = form.getAttribute('onsubmit') || '';
                let confirmMsg = null;
                if (onsubmitAttr.includes('confirm(')) {
                    const match = onsubmitAttr.match(/confirm\(\s*['"](.*?)['"]\s*\)/);
                    if (match && match[1]) {
                        confirmMsg = match[1].replace(/\\'/g, "'").replace(/\\"/g, '"');
                    }
                } else if (form.dataset.confirm) {
                    confirmMsg = form.dataset.confirm;
                }

                if (confirmMsg) {
                    e.preventDefault();
                    e.stopImmediatePropagation();

                    const isDanger = /xóa|từ chối|hủy|giải tán|cảnh báo|delete|reject|dissolve|cancel|unassign/i.test(confirmMsg);

                    window.showConfirmDialog({
                        title: isDanger ? 'Xác nhận hành động' : 'Xác nhận phê duyệt',
                        message: confirmMsg,
                        type: isDanger ? 'danger' : 'primary',
                        confirmText: isDanger ? 'Đồng ý thực hiện' : 'Xác nhận',
                        onConfirm: function () {
                            form._isConfirmed = true;
                            form.submit();
                        }
                    });

            }, true);

                    tooltipTriggerList.forEach(function (el) { new bootstrap.Tooltip(el); });

                detectAndShowFlashMessages();

                // === STAT COUNTER ANIMATION ===
                function animateCounter(el) {
                    var target = parseFloat(el.dataset.target || el.textContent.replace(/[^0-9.]/g, '')) || 0;
                    var isFloat = String(target).includes('.');
                    var decimals = isFloat ? 1 : 0;
                    var duration = 800;
                    var start = performance.now();
                    function step(now) {
                        var elapsed = Math.min((now - start) / duration, 1);
                        var eased = 1 - Math.pow(1 - elapsed, 3);
                        var val = target * eased;
                        el.textContent = isFloat ? val.toFixed(decimals) : Math.floor(val);
                        if (elapsed < 1) requestAnimationFrame(step);
                        else el.textContent = isFloat ? target.toFixed(decimals) : target;
                    }
                    requestAnimationFrame(step);
                }
                if (window.IntersectionObserver) {
                    var cObs = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) { animateCounter(entry.target); cObs.unobserve(entry.target); }
                        });
                    }, { threshold: 0.5 });
                    document.querySelectorAll('[data-counter]').forEach(function (el) {
                        el.dataset.target = el.textContent.trim();
                        el.textContent = '0';
                        cObs.observe(el);
                    });
                }

                        try { sessionStorage.setItem('col-' + btn.dataset.collapseTarget, c ? '1' : '0'); } catch (e) { }
                    });
                    try {
                        if (sessionStorage.getItem('col-' + btn.dataset.collapseTarget) === '1') {
                            var t = document.getElementById(btn.dataset.collapseTarget);

                    } catch (e) { }

                if (document.body) {

                }

                var bar = document.createElement('div');
                bar.className = 'page-loader-bar';
                document.documentElement.appendChild(bar);
                var w = 0, iv = null;

                function startPL() {
                    w = 0; bar.style.opacity = '1'; bar.style.width = '0%';
                    if (overlay) overlay.classList.add('is-loading');
                    clearInterval(iv);
                    iv = setInterval(function () {
                        if (w < 85) { w += (85 - w) * 0.08 + 0.5; bar.style.width = Math.min(w, 85) + '%'; }
                    }, 40);
                }

                function finishPL() {
                    clearInterval(iv); bar.style.width = '100%';

                        renderDayView();
                    }
                }

                function updateHeader() {
                    var titleEl = document.getElementById('fullCalMonthYearTitle');
                    if (!titleEl) return;
                    var monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
                    titleEl.textContent = monthNames[currentDate.getMonth()] + " " + currentDate.getFullYear();
                }

                function formatDateYMD(d) {
                    var year = d.getFullYear();
                    var month = String(d.getMonth() + 1).padStart(2, '0');
                    var day = String(d.getDate()).padStart(2, '0');
                    return year + '-' + month + '-' + day;
                }

                function renderMonthView() {
                    var grid = document.getElementById('fullCalMonthGrid');
                    if (!grid) return;
                    grid.innerHTML = '';

                    var year = currentDate.getFullYear();
                    var month = currentDate.getMonth();

                    var firstDayIndex = new Date(year, month, 1).getDay(); // 0 = Sunday
                    var totalDays = new Date(year, month + 1, 0).getDate();
                    var prevMonthTotalDays = new Date(year, month, 0).getDate();

                    var todayStr = formatDateYMD(new Date());
                    var allEvents = getFilteredEvents();

                    // 1. Previous Month Tail Days
                    for (var i = firstDayIndex - 1; i >= 0; i--) {
                        var pDay = prevMonthTotalDays - i;
                        var pDate = new Date(year, month - 1, pDay);
                        var pDateStr = formatDateYMD(pDate);
                        var cell = createCell(pDay, pDateStr, true, pDateStr === todayStr, allEvents);
                        grid.appendChild(cell);
                    }

                    // 2. Current Month Days
                    for (var day = 1; day <= totalDays; day++) {
                        var cDate = new Date(year, month, day);
                        var cDateStr = formatDateYMD(cDate);
                        var cell = createCell(day, cDateStr, false, cDateStr === todayStr, allEvents);
                        grid.appendChild(cell);
                    }

                    // 3. Next Month Leading Days to complete 35 or 42 grid cells
                    var totalCells = firstDayIndex + totalDays;
                    var nextDaysCount = (totalCells % 7 === 0) ? 0 : 7 - (totalCells % 7);
                    for (var nDay = 1; nDay <= nextDaysCount; nDay++) {
                        var nDate = new Date(year, month + 1, nDay);
                        var nDateStr = formatDateYMD(nDate);
                        var cell = createCell(nDay, nDateStr, true, nDateStr === todayStr, allEvents);
                        grid.appendChild(cell);
                    }
                }

                function createCell(dayNum, dateStr, isOtherMonth, isToday, eventsList) {
                    var cell = document.createElement('div');
                    cell.className = 'calendar-cell' + (isOtherMonth ? ' other-month' : '') + (isToday ? ' today' : '');
                    
                    var header = document.createElement('div');
                    header.className = 'day-header';
                    var numSpan = document.createElement('span');
                    numSpan.className = 'day-number';
                    numSpan.textContent = dayNum;
                    header.appendChild(numSpan);
                    cell.appendChild(header);

                    var evContainer = document.createElement('div');
                    evContainer.className = 'events-container';

                    var dayEvents = eventsList.filter(function(e) {
                        return e.date === dateStr;
                    });

                    var maxVisible = 3;
                    dayEvents.slice(0, maxVisible).forEach(function(ev) {
                        var pill = document.createElement('a');
                        pill.href = "javascript:void(0)";
                        pill.className = 'cal-event-pill ' + (ev.colorClass || 'cal-event-teal');
                        pill.title = ev.title + ' (' + (ev.time || '') + ')';
                        pill.innerHTML = '<span class="fw-bold">' + escapeHtml(ev.title) + '</span>' + 
                                         (ev.time ? '<span class="d-block opacity-80" style="font-size:0.6rem; font-weight:500;">🕒 ' + escapeHtml(ev.time) + '</span>' : '');
                        pill.onclick = function(e) {
                            e.stopPropagation();
                            showEventDetail(ev);
                        };
                        evContainer.appendChild(pill);
                    });

                    if (dayEvents.length > maxVisible) {
                        var moreBtn = document.createElement('span');
                        moreBtn.className = 'badge bg-slate-100 text-slate-600 rounded-full px-2 py-0.5 text-3xs font-bold cursor-pointer hover:bg-slate-200 mt-1';
                        moreBtn.textContent = '+' + (dayEvents.length - maxVisible) + ' sự kiện nữa';
                        moreBtn.onclick = function(e) {
                            e.stopPropagation();
                            currentDate = new Date(dateStr + 'T00:00:00');
                            setView('day');
                        };
                        evContainer.appendChild(moreBtn);
                    }

                    cell.appendChild(evContainer);

                    cell.ondblclick = function() {
                        openAddModal(dateStr);
                    };

                    return cell;
                }

                function renderWeekView() {
                    var grid = document.getElementById('fullCalWeekGrid');
                    if (!grid) return;
                    grid.innerHTML = '';

                    var curr = new Date(currentDate);
                    var firstDay = curr.getDate() - curr.getDay(); // First day is Sunday
                    var allEvents = getFilteredEvents();
                    var todayStr = formatDateYMD(new Date());

                    var shortDayLabels = ["CN", "THỨ 2", "THỨ 3", "THỨ 4", "THỨ 5", "THỨ 6", "THỨ 7"];

                    for (var i = 0; i < 7; i++) {
                        var d = new Date(curr.getFullYear(), curr.getMonth(), firstDay + i);
                        var dStr = formatDateYMD(d);
                        var isToday = dStr === todayStr;

                        var col = document.createElement('div');
                        col.className = 'cal-week-col' + (isToday ? ' is-today' : '');
                        
                        var headerHtml = '<div class="cal-week-header">' +
                                         '<span class="cal-week-day-name">' + shortDayLabels[i] + '</span>' +
                                         '<div class="cal-week-date-num">' + d.getDate() + '</div>' +
                                         (isToday ? '<span class="badge bg-teal-500 text-white rounded-full px-2 py-0.5 mt-1" style="font-size: 0.6rem; font-weight: 800; letter-spacing: 0.04em;">HÔM NAY</span>' : '<span class="text-3xs text-slate-400 font-semibold d-block mt-0.5">Thg ' + (d.getMonth() + 1) + '</span>') +
                                         '</div>';
                        
                        col.innerHTML = headerHtml;

                        var evBox = document.createElement('div');
                        evBox.className = 'd-flex flex-column gap-2 flex-grow-1 overflow-y-auto';

                        var dayEvents = allEvents.filter(function(e) { return e.date === dStr; });
                        if (dayEvents.length === 0) {
                            var emptySlot = document.createElement('div');
                            emptySlot.className = 'cal-empty-week-slot';
                            emptySlot.innerHTML = '<i class="fa-regular fa-calendar-plus text-slate-300 text-lg mb-1.5"></i>' +
                                                  '<span class="text-3xs font-bold text-slate-400 block">Trống lịch</span>' +
                                                  '<span class="text-3xs text-teal-600 font-extrabold mt-1 opacity-90">+ Thêm việc</span>';
                            emptySlot.onclick = (function(targetDate) {
                                return function() { openAddModal(targetDate); };
                            })(dStr);
                            evBox.appendChild(emptySlot);
                        } else {
                            dayEvents.forEach(function(ev) {
                                var item = document.createElement('div');
                                var borderClass = 'border-teal';
                                if (ev.colorClass === 'cal-event-cyan') borderClass = 'border-cyan';
                                else if (ev.colorClass === 'cal-event-indigo') borderClass = 'border-indigo';
                                else if (ev.colorClass === 'cal-event-amber') borderClass = 'border-amber';
                                else if (ev.colorClass === 'cal-event-rose') borderClass = 'border-rose';

                                item.className = 'cal-week-event-card ' + borderClass;
                                item.innerHTML = '<div class="d-flex align-items-center justify-content-between mb-1">' +
                                                 '<span class="badge bg-white text-slate-700 font-bold border border-slate-200/80 rounded-full px-2 py-0.5 text-3xs" style="font-size: 0.58rem;">' + escapeHtml(ev.typeName || ev.type) + '</span>' +
                                                 (ev.time ? '<span class="text-3xs text-slate-500 font-bold">' + escapeHtml(ev.time) + '</span>' : '') +
                                                 '</div>' +
                                                 '<div class="fw-extrabold text-slate-900 text-xs line-clamp-2 mb-1" style="line-height: 1.35;">' + escapeHtml(ev.title) + '</div>' +
                                                 (ev.location ? '<div class="text-3xs text-slate-500 font-medium d-flex align-items-center gap-1"><i class="fa-solid fa-location-dot text-teal-600" style="font-size: 0.65rem;"></i><span class="truncate">' + escapeHtml(ev.location) + '</span></div>' : '');
                                
                                item.onclick = function(e) {
                                    e.stopPropagation();
                                    showEventDetail(ev);
                                };
                                evBox.appendChild(item);
                            });

                            var addMiniBtn = document.createElement('button');
                            addMiniBtn.type = 'button';
                            addMiniBtn.className = 'btn btn-xs w-100 mt-2 py-1.5 rounded-xl border border-dashed border-slate-200 text-slate-400 hover:text-teal-700 hover:border-teal-400 hover:bg-teal-50/50 text-3xs font-bold transition d-flex align-items-center justify-content-center gap-1';
                            addMiniBtn.innerHTML = '<i class="fa-solid fa-plus text-3xs"></i> <span>Thêm việc</span>';
                            addMiniBtn.onclick = (function(targetDate) {
                                return function() { openAddModal(targetDate); };
                            })(dStr);
                            evBox.appendChild(addMiniBtn);
                        }

                        col.appendChild(evBox);

                        col.ondblclick = (function(targetDate) {
                            return function() { openAddModal(targetDate); };
                        })(dStr);

                        grid.appendChild(col);
                    }
                }

                function renderDayView() {
                    var container = document.getElementById('fullCalDayContent');
                    if (!container) return;
                    var dStr = formatDateYMD(currentDate);
                    var allEvents = getFilteredEvents().filter(function(e) { return e.date === dStr; });

                    var dayNames = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
                    var dayName = dayNames[currentDate.getDay()];

                    var html = '<div class="d-flex align-items-center justify-content-between pb-3 mb-4 border-b border-slate-100">' +
                               '<div>' +
                               '<span class="badge bg-teal-100 text-teal-800 rounded-full px-3 py-1 text-xs font-bold mb-1">' + dayName + '</span>' +
                               '<h3 class="text-xl font-extrabold text-slate-900 mb-0">Lịch trình ngày ' + currentDate.getDate() + '/' + (currentDate.getMonth() + 1) + '/' + currentDate.getFullYear() + '</h3>' +
                               '</div>' +
                               '<button type="button" class="btn btn-sm btn-dark rounded-full px-3.5 py-1.5 text-xs font-bold" onclick="fullCalendarApp.openAddModal(\'' + dStr + '\')">' +
                               '<i class="fa-solid fa-plus me-1"></i> Thêm việc ngày này' +
                               '</button>' +
                               '</div>';

                    if (allEvents.length === 0) {
                        html += '<div class="p-5 text-center text-slate-400">' +
                                '<i class="fa-regular fa-calendar-check text-4xl mb-2 opacity-30"></i>' +
                                '<p class="text-xs mb-0">Không có sự kiện hay hạn chót nào trong ngày này.</p>' +
                                '</div>';
                    } else {
                        html += '<div class="space-y-3">';
                        allEvents.forEach(function(ev) {
                            html += '<div class="p-3.5 rounded-2xl border border-slate-200/80 hover:border-teal-300 bg-white transition d-flex align-items-center justify-content-between gap-3 shadow-2xs">' +
                                    '<div class="d-flex align-items-center gap-3">' +
                                    '<div class="w-10 h-10 rounded-2xl ' + (ev.colorClass || 'cal-event-teal') + ' d-flex align-items-center justify-content-center flex-shrink-0 text-sm">' +
                                    '<i class="fa-solid ' + (ev.icon || 'fa-calendar-check') + '"></i>' +
                                    '</div>' +
                                    '<div>' +
                                    '<div class="d-flex align-items-center gap-2">' +
                                    '<span class="badge bg-slate-100 text-slate-700 font-bold rounded-full px-2 py-0.5 text-3xs">' + escapeHtml(ev.typeName || ev.type) + '</span>' +
                                    '<span class="text-xs font-bold text-slate-900">' + escapeHtml(ev.title) + '</span>' +
                                    '</div>' +
                                    '<div class="text-3xs text-slate-500 mt-1 d-flex gap-3">' +
                                    '<span><i class="fa-regular fa-clock text-teal-600 me-1"></i>' + escapeHtml(ev.time || 'Cả ngày') + '</span>' +
                                    (ev.location ? '<span><i class="fa-solid fa-location-dot text-teal-600 me-1"></i>' + escapeHtml(ev.location) + '</span>' : '') +
                                    '</div>' +
                                    '</div>' +
                                    '</div>' +
                                    '<button type="button" class="btn btn-sm btn-light border border-slate-200/80 rounded-full px-3 py-1 text-xs font-bold" onclick=\'fullCalendarApp.showEventDetail(' + JSON.stringify(ev) + ')\'>Chi tiết</button>' +
                                    '</div>';
                        });
                        html += '</div>';
                    }

                    container.innerHTML = html;
                }

                function prevMonth() {
                    if (currentView === 'month') {
                        currentDate.setMonth(currentDate.getMonth() - 1);
                    } else if (currentView === 'week') {
                        currentDate.setDate(currentDate.getDate() - 7);
                    } else if (currentView === 'day') {
                        currentDate.setDate(currentDate.getDate() - 1);
                    }
                    render();
                }

                function nextMonth() {
                    if (currentView === 'month') {
                        currentDate.setMonth(currentDate.getMonth() + 1);
                    } else if (currentView === 'week') {
                        currentDate.setDate(currentDate.getDate() + 7);
                    } else if (currentView === 'day') {
                        currentDate.setDate(currentDate.getDate() + 1);
                    }
                    render();
                }

                function goToToday() {
                    currentDate = new Date();
                    render();
                }

                function setView(view) {
                    currentView = view;
                    ['day', 'week', 'month'].forEach(function(v) {
                        var btn = document.getElementById('viewBtn' + v.charAt(0).toUpperCase() + v.slice(1));
                        if (btn) {
                            if (v === view) {
                                btn.classList.add('active-cal-view', 'font-extrabold', 'shadow-2xs');
                            } else {
                                btn.classList.remove('active-cal-view', 'font-extrabold', 'shadow-2xs');
                            }
                        }
                    });

                    var monthPanel = document.getElementById('calendarMonthViewContainer');
                    var weekPanel = document.getElementById('calendarWeekViewContainer');
                    var dayPanel = document.getElementById('calendarDayViewContainer');

                    if (monthPanel) monthPanel.classList.toggle('d-none', view !== 'month');
                    if (weekPanel) weekPanel.classList.toggle('d-none', view !== 'week');
                    if (dayPanel) dayPanel.classList.toggle('d-none', view !== 'day');

                    render();
                }

                function setFilter(type, label) {
                    currentFilter = type;
                    var labelEl = document.getElementById('agendaFilterLabel');
                    if (labelEl) labelEl.textContent = label;
                    render();
                }

                function showEventDetail(ev) {
                    selectedEvent = ev;
                    var modalEl = document.getElementById('eventDetailModal');
                    if (!modalEl) return;

                    document.getElementById('eventDetailTitle').textContent = ev.title || 'Sự kiện';
                    document.getElementById('eventDetailType').textContent = ev.typeName || ev.type || 'Lịch trình';
                    document.getElementById('eventDetailDate').textContent = ev.date || '--';
                    document.getElementById('eventDetailTime').textContent = ev.time || 'Cả ngày';
                    document.getElementById('eventDetailLocation').textContent = ev.location || 'Tại Trường / Trực tuyến';
                    
                    var descEl = document.getElementById('eventDetailDesc');
                    var descRow = document.getElementById('eventDetailDescRow');
                    if (ev.desc || ev.location) {
                        descEl.textContent = ev.desc || ('Sự kiện được đồng bộ tự động từ hệ thống quản lý đề tài TopicHub. Vui lòng theo dõi đúng thời gian và địa điểm: ' + (ev.location || ''));
                        descRow.classList.remove('d-none');
                    } else {
                        descRow.classList.add('d-none');
                    }

                    var deleteBtn = document.getElementById('eventDetailDeleteBtn');
                    if (deleteBtn) {
                        deleteBtn.classList.toggle('d-none', !ev.isCustom);
                    }

                    var actionBtn = document.getElementById('eventDetailActionBtn');
                    if (actionBtn) {
                        if (ev.actionUrl && ev.actionUrl !== '#' && !ev.isCustom) {
                            actionBtn.href = ev.actionUrl;
                            actionBtn.classList.remove('d-none');
                        } else {
                            actionBtn.classList.add('d-none');
                        }
                    }

                    var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();
                }

                function openAddModal(prefillDate) {
                    var modalEl = document.getElementById('addScheduleModal');
                    if (!modalEl) return;
                    var dateInput = document.getElementById('noteDate');
                    if (dateInput) {
                        dateInput.value = prefillDate || formatDateYMD(currentDate);
                    }
                    var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.show();
                }

                function saveCustomNote(e) {
                    if (e) e.preventDefault();
                    var title = document.getElementById('noteTitle').value;
                    var date = document.getElementById('noteDate').value;
                    var time = document.getElementById('noteTime').value;
                    var location = document.getElementById('noteLocation').value;
                    var desc = document.getElementById('noteDesc').value;
                    var colorEl = document.querySelector('input[name="noteColor"]:checked');
                    var colorClass = colorEl ? colorEl.value : 'cal-event-teal';

                    if (!title || !date) return;

                    var notes = getCustomNotes();
                    notes.push({
                        id: Date.now(),
                        title: title.trim(),
                        date: date,
                        time: time,
                        location: location ? location.trim() : '',
                        desc: desc ? desc.trim() : '',
                        colorClass: colorClass
                    });
                    saveCustomNotes(notes);

                    var modalEl = document.getElementById('addScheduleModal');
                    if (modalEl) {
                        var modal = bootstrap.Modal.getInstance(modalEl);
                        if (modal) modal.hide();
                    }

                    document.getElementById('addScheduleForm').reset();
                    if (window.showToast) window.showToast('Đã thêm lịch hẹn / ghi chú mới thành công!', 'success');
                    render();
                }

                function deleteCurrentNote() {
                    if (!selectedEvent || !selectedEvent.isCustom) return;
                    if (!confirm('Bạn có chắc muốn xóa ghi chú lịch này không?')) return;

                    var notes = getCustomNotes();
                    notes = notes.filter(function(n) { return n.id !== selectedEvent.rawId; });
                    saveCustomNotes(notes);

                    var modalEl = document.getElementById('eventDetailModal');
                    if (modalEl) {
                        var modal = bootstrap.Modal.getInstance(modalEl);
                        if (modal) modal.hide();
                    }

                    if (window.showToast) window.showToast('Đã xóa ghi chú khỏi lịch!', 'info');
                    render();
                }

                function escapeHtml(str) {
                    if (!str) return '';
                    var div = document.createElement('div');
                    div.appendChild(document.createTextNode(str));
                    return div.innerHTML;
                }

                document.addEventListener('DOMContentLoaded', init);

                return {
                    init: init,
                    render: render,
                    prevMonth: prevMonth,
                    nextMonth: nextMonth,
                    goToToday: goToToday,
                    setView: setView,
                    setFilter: setFilter,
                    showEventDetail: showEventDetail,
                    openAddModal: openAddModal,
                    saveCustomNote: saveCustomNote,
                    deleteCurrentNote: deleteCurrentNote
                };
            })();

            /* =========================================================
             *  WELLNEST ACCORDION CATEGORY TREE FILTER CONTROLLER
             * ========================================================= */
            window.toggleTreeGroup = function(headerBtn) {
                var group = headerBtn.closest('.tree-group');
                if (!group) return;
                var subList = group.querySelector('.tree-sub-list');
                var isOpen = group.classList.contains('is-open');
                
                if (isOpen) {
                    group.classList.remove('is-open');
                    if (subList) subList.classList.add('d-none');
                } else {
                    group.classList.add('is-open');
                    if (subList) subList.classList.remove('d-none');
                }
            };

            window.filterByTreeCriteria = function(type, value, el) {
                document.querySelectorAll('.tree-sub-item').forEach(function(item) {
                    item.classList.remove('active');
                });
                if (el) el.classList.add('active');

                var rows = document.querySelectorAll('.topic-item-row, .kanban-card, .student-topic-card');
                var visibleCount = 0;

                rows.forEach(function(row) {
                    var match = true;
                    if (type === 'ALL') {
                        match = true;
                    } else if (type === 'STATUS') {
                        var status = (row.dataset.status || '').toUpperCase();
                        match = (value === 'ALL' || status === value);
                    } else if (type === 'WORKFLOW') {
                        var status = (row.dataset.status || '').toUpperCase();
                        var hasReviewer = row.dataset.hasReviewer === 'true';
                        var hasCouncil = row.dataset.hasCouncil === 'true';
                        if (value === 'PENDING') match = (status === 'PENDING');
                        else if (value === 'NEEDS_REVIEWER') match = (status === 'APPROVED' && !hasReviewer);
                        else if (value === 'NEEDS_COUNCIL') match = (status === 'APPROVED' && hasReviewer && !hasCouncil);
                        else if (value === 'READY') match = (status === 'APPROVED' && hasReviewer && hasCouncil);
                    } else if (type === 'PERIOD') {
                        var period = (row.dataset.topicPeriod || '').toLowerCase();
                        match = (value === 'ALL' || period.includes(value.toLowerCase()));
                    } else if (type === 'MAJOR') {
                        var major = (row.dataset.topicMajor || '').toLowerCase();
                        match = (value === 'ALL' || major.includes(value.toLowerCase()));
                    } else if (type === 'SUPERVISOR') {
                        var supervisor = (row.dataset.topicSupervisor || '').toLowerCase();
                        match = (value === 'ALL' || supervisor.includes(value.toLowerCase()));
                    } else if (type === 'AVAILABILITY') {
                        var isTaken = row.dataset.topicIsTaken === 'true';
                        if (value === 'AVAILABLE') match = !isTaken;
                        else if (value === 'TAKEN') match = isTaken;
                        else match = true;
                    }

                    if (match) {
                        row.style.display = '';
                        visibleCount++;
                    } else {
                        row.style.display = 'none';
                    }
                });

                var countBadge = document.getElementById('filteredRowCount');
                if (countBadge) {
                    countBadge.textContent = 'Hiển thị: ' + visibleCount + ' đề tài';
                }
            };

            window.searchTreeItems = function(keyword) {
                var term = (keyword || '').toLowerCase().trim();
                document.querySelectorAll('.tree-sub-item').forEach(function(item) {
                    var text = item.textContent.toLowerCase();
                    if (!term || text.includes(term)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            };
        </script>
    </div>
</body>
