<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý Đề tài Sinh viên</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5.3 & FontAwesome 6 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 36px 32px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
            background: #ffffff;
        }
        .login-logo {
            width: 48px;
            height: 48px;
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }
        .btn-login {
            background-color: #0f172a;
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            border-radius: 8px;
            padding: 0.625rem;
            border: 1px solid #0f172a;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            transition: all 0.15s ease;
        }
        .btn-login:hover {
            background-color: #1e293b;
            color: white;
        }
        .form-control {
            border-color: #cbd5e1;
            font-size: 0.875rem;
            border-radius: 8px;
            padding: 0.6rem 0.75rem;
        }
        .form-control:focus {
            border-color: #64748b;
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            border-radius: 8px 0 0 8px;
        }
        .form-control {
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="login-logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">TopicHub</h4>
        <p class="text-muted small mb-0">Hệ thống Quản lý Đề tài Khoa CNTT</p>
    </div>

    <!-- Alert notifications -->
    <div th:if="${error}" class="alert alert-danger py-2 px-3 mb-3 small d-flex align-items-center rounded-3" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2"></i>
        <span th:text="${error}"></span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 px-3 mb-3 small d-flex align-items-center rounded-3" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span>Bạn đã đăng xuất thành công.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small mb-1">Tên đăng nhập / MSSV</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-user text-muted"></i></span>
                <input type="text" name="username" th:value="${username}" class="form-control" placeholder="Nhập mã số hoặc username" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small mb-1">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu của bạn" required>
            </div>
        </div>

        <button type="submit" class="btn btn-login w-100 mb-3">Đăng nhập</button>
    </form>

    <div class="p-3 bg-light rounded-3 border mt-3">
        <div class="fw-semibold text-dark small mb-2 d-flex align-items-center gap-1">
            <i class="fa-solid fa-database text-primary"></i> Tài khoản trong Database SQL (Mật khẩu: <code>123456</code>):
        </div>
        <div class="row g-1 text-muted" style="font-size: 11px;">
            <div class="col-6 mb-1">
                <strong>Quản trị:</strong> <code>admin</code> (<code>admin123</code>)
            </div>
            <div class="col-6 mb-1">
                <strong>Trưởng khoa:</strong> <code>head</code>, <code>dean_cntt</code>
            </div>
            <div class="col-6 mb-1">
                <strong>Giảng viên:</strong> <code>gv_hung</code>, <code>gv_nam</code>, <code>gv_huong</code>
            </div>
            <div class="col-6 mb-1">
                <strong>Sinh viên:</strong> <code>sv_nuong</code>, <code>sv_an</code>, <code>sv_binh</code>
            </div>
        </div>
    </div>
</div>

</body>
</html>
