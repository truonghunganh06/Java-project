<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý Đề tài Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: #ffffff;
        }
        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-header i {
            font-size: 40px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }
        .btn-login {
            background-color: #1e3a8a;
            color: white;
            font-weight: 600;
        }
        .btn-login:hover {
            background-color: #1d4ed8;
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-graduation-cap"></i>
        <h4 class="fw-bold text-dark">HỆ THỐNG QUẢN LÝ ĐỀ TÀI</h4>
        <p class="text-muted small">Khoa Công nghệ Thông tin</p>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold">Tên đăng nhập / MSSV</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Nhập mã số hoặc username" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
        </div>

        <button type="submit" class="btn btn-login w-100 py-2">Đăng Nhập</button>
    </form>
</div>

</body>
</html>
