<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head th:replace="~{fragments/head :: head('Lỗi máy chủ (500) - TopicHub')}"></head>

<body
    class="bg-slate-50 min-h-screen d-flex align-items-center justify-content-center p-3 p-md-4 position-relative overflow-x-hidden">

    <!-- Ambient Glowing Background Circles -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Main Error Card Container -->
    <div
        class="error-card saas-card max-w-lg w-100 p-4 p-md-5 text-center shadow-2xl border border-slate-200/80 rounded-3xl bg-white position-relative z-10">

        <!-- Big Animated 500 Badge & Mascot Hero Unit -->
        <div class="error-hero-container mb-4">
            <div class="hero-error-text-wrap">
                <span class="hero-error-text">500</span>
            </div>

            <!-- Floating Mascot Character -->
            <div class="mascot-error-wrap">
                <img th:src="@{/images/mascot/black_dot_smart.png?v=2}" src="/images/mascot/black_dot_smart.png?v=2"
                    alt="Black Dot AI Mascot" class="mascot-error-img" />
                <div class="mascot-error-shadow"></div>

                <!-- Mascot Speech Bubble -->
                <div class="mascot-speech-bubble shadow-sm">
                    <span>Meow! Máy chủ đang hắt hơi nhẹ ⚡ Đừng lo, thử lại nhé! 🐾</span>
                </div>
            </div>
        </div>

        <!-- Title & Description -->
        <h1 class="text-xl text-md-2xl font-black text-slate-900 mb-2 tracking-tight">Lỗi máy chủ (500)</h1>
        <p class="text-xs text-slate-500 mb-3 leading-relaxed max-w-sm mx-auto">
            Hệ thống đã gặp sự cố tạm thời trong quá trình xử lý yêu cầu. Vui lòng thử lại sau giây lát hoặc quay về
            trang chủ.
        </p>

        <!-- URL Path Pill -->
        <div class="p-2.5 bg-slate-50 rounded-xl border border-slate-200/80 text-xs text-slate-500 mb-4 text-center font-mono inline-block max-w-full truncate"
            th:if="${path}">
            <span class="text-slate-400">Đường dẫn: </span><span class="text-blue-600 font-semibold"
                th:text="${path}">/url</span>
        </div>

        <!-- Main CTA Action Buttons -->
        <div class="d-flex flex-column flex-sm-row align-items-center justify-content-center gap-2.5">
            <a th:href="@{/}"
                class="btn-motion-primary btn-error-primary w-100 w-sm-auto d-inline-flex align-items-center justify-content-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold text-white shadow-md">
                <i class="fa-solid fa-house-chimney text-xs"></i>
                <span>Trở về Trang chủ</span>
            </a>
            <button type="button" onclick="goBackOrLogin()"
                class="btn-motion-secondary btn-error-secondary w-100 w-sm-auto d-inline-flex align-items-center justify-content-center gap-2 px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-700 bg-slate-100 border border-slate-200">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Quay lại trang trước</span>
            </button>
        </div>

    </div>

    <script>
        function goBackOrLogin() {
            if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
                history.back();
            } else {
                window.location.href = '/login';
            }
        }
    </script>

    <!-- Page Specific Animations & Motion Styles -->
    <style>
        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.45;
            z-index: 1;
        }

        .glow-1 {
            width: 320px;
            height: 320px;
            background: rgba(37, 99, 235, 0.25);
            top: 15%;
            left: 20%;
            animation: glowFloat 8s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: rgba(99, 102, 241, 0.2);
            bottom: 15%;
            right: 20%;
            animation: glowFloat 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes glowFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        /* Card Entry Animation */
        .error-card {
            animation: cardFadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Error Hero Container */
        .error-hero-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 10px;
        }

        .hero-error-text-wrap {
            line-height: 0.8;
            user-select: none;
        }

        .hero-error-text {
            font-size: 7.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.06em;
            display: block;
        }

        /* Mascot Wrap & Floating Motion */
        .mascot-error-wrap {
            position: relative;
            margin-top: -65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .mascot-error-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: mascotFloat 3.6s infinite ease-in-out;
            transition: transform 0.3s ease;
        }

        .mascot-error-wrap:hover .mascot-error-img {
            transform: scale(1.12) rotate(4deg);
        }

        .mascot-error-shadow {
            width: 60px;
            height: 10px;
            background: rgba(15, 23, 42, 0.12);
            border-radius: 50%;
            margin-top: -6px;
            animation: mascotShadow 3.6s infinite ease-in-out;
        }

        @keyframes mascotFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes mascotShadow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.15;
            }

            50% {
                transform: scale(0.7);
                opacity: 0.07;
            }
        }

        /* Speech Bubble */
        .mascot-speech-bubble {
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 14px;
            margin-top: 8px;
            border: 1px solid #334155;
            position: relative;
            animation: bubblePulse 3s infinite ease-in-out;
        }

        .mascot-speech-bubble::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #0f172a;
            border-top: 1px solid #334155;
            border-left: 1px solid #334155;
        }

        @keyframes bubblePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        /* Button Hover Motion */
        .btn-error-primary {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-error-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35) !important;
        }

        .btn-error-secondary {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-error-secondary:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08) !important;
        }

        /* Dark Mode Compatibility */
        [data-theme="dark"] .error-card {
            background: #0f172a !important;
            border-color: #1e293b !important;
        }

        [data-theme="dark"] .hero-error-text {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        [data-theme="dark"] .mascot-speech-bubble {
            background: #1e293b;
            border-color: #334155;
            color: #f8fafc;
        }

        [data-theme="dark"] .mascot-speech-bubble::before {
            background: #1e293b;
            border-color: #334155;
        }

        [data-theme="dark"] .btn-error-secondary {
            background: #1e293b !important;
            color: #e2e8f0 !important;
            border-color: #334155 !important;
        }

        [data-theme="dark"] .btn-error-secondary:hover {
            background: #334155 !important;
            color: #ffffff !important;
        }
    </style>

</body>

</html>
