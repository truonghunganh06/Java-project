<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head th:replace="~{fragments/head :: head('Không tìm thấy trang (404) - TopicHub')}"></head>

<body
    class="min-h-screen d-flex align-items-center justify-content-center p-3 p-md-4 position-relative overflow-x-hidden" style="background-color: #F4F8F7;">

    <!-- Ambient Glowing Background Circles (WellNest Mint/Sage) -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Main 404 Card Container -->
    <div
        class="error-404-card saas-card max-w-lg w-100 p-4 p-md-5 text-center shadow-wellnest border border-slate-200/80 rounded-3xl bg-white position-relative z-10" style="border-radius: 28px;">

        <!-- Big Animated 404 Badge & Mascot Hero Unit -->
        <div class="error-hero-container mb-4">
            <div class="hero-404-text-wrap">
                <span class="hero-404-text">404</span>
            </div>

            <!-- Floating Mascot Character -->
            <div class="mascot-404-wrap">
                <img th:src="@{/images/mascot/black_dot_smart.png?v=2}" src="/images/mascot/black_dot_smart.png?v=2"
                    alt="Black Dot AI Mascot" class="mascot-404-img" />
                <div class="mascot-404-shadow"></div>

                <!-- Mascot Speech Bubble -->
                <div class="mascot-speech-bubble shadow-wellnest-sm">
                    <span>Meow! Black Dot tìm hoài không thấy trang này... 🐾</span>
                </div>
            </div>
        </div>

        <!-- Title & Description -->
        <h1 class="text-xl text-md-2xl font-black text-slate-900 mb-2 tracking-tight" style="font-family: 'Plus Jakarta Sans', sans-serif;">404 – Không tìm thấy trang</h1>
        <p class="text-xs text-slate-500 mb-4 leading-relaxed max-w-sm mx-auto">
            Đường dẫn bạn truy cập có thể đã bị thay đổi, xóa bỏ hoặc không tồn tại trên hệ thống TopicHub.
        </p>

        <!-- Main CTA Action Buttons (WellNest Rounded-Full Pills) -->
        <div class="d-flex flex-column flex-sm-row align-items-center justify-content-center gap-2.5 mb-2">
            <a th:href="@{/}"
                class="btn bg-slate-900 hover:bg-slate-800 text-teal-300 w-100 w-sm-auto d-inline-flex align-items-center justify-content-center gap-2 px-5 py-2.5 rounded-full text-xs font-bold shadow-wellnest border-0 transition">
                <i class="fa-solid fa-house text-xs"></i>
                <span>Trở về Trang chủ</span>
            </a>
            <button type="button" onclick="goBackOrLogin()"
                class="btn bg-white hover:bg-slate-50 text-slate-700 border border-slate-200/90 w-100 w-sm-auto d-inline-flex align-items-center justify-content-center gap-2 px-5 py-2.5 rounded-full text-xs font-bold shadow-2xs transition">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Quay lại trang trước</span>
            </button>
        </div>

    </div>

    <script>
        function goBackOrLogin() {
            if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
                history.back();
            } else {
                window.location.href = '/login';
            }
        }
    </script>

    <!-- Page Specific Animations & Motion Styles -->
    <style>
        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.45;
            z-index: 1;
        }

        .glow-1 {
            width: 320px;
            height: 320px;
            background: rgba(45, 212, 191, 0.25);
            top: 15%;
            left: 20%;
            animation: glowFloat 8s infinite alternate ease-in-out;
        }

        .glow-2 {
            width: 350px;
            height: 350px;
            background: rgba(20, 184, 166, 0.18);
            bottom: 15%;
            right: 20%;
            animation: glowFloat 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes glowFloat {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        /* Card Entry Animation */
        .error-404-card {
            animation: cardFadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardFadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 404 Hero Container */
        .error-hero-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 10px;
        }

        .hero-404-text-wrap {
            line-height: 0.8;
            user-select: none;
        }

        .hero-404-text {
            font-size: 7.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.06em;
            display: block;
        }

        /* Mascot Wrap & Floating Motion */
        .mascot-404-wrap {
            position: relative;
            margin-top: -65px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .mascot-404-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            animation: mascotFloat 3.6s infinite ease-in-out;
            transition: transform 0.3s ease;
        }

        .mascot-404-wrap:hover .mascot-404-img {
            transform: scale(1.12) rotate(4deg);
        }

        .mascot-404-shadow {
            width: 60px;
            height: 10px;
            background: rgba(15, 23, 42, 0.12);
            border-radius: 50%;
            margin-top: -6px;
            animation: mascotShadow 3.6s infinite ease-in-out;
        }

        @keyframes mascotFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes mascotShadow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.15;
            }

            50% {
                transform: scale(0.7);
                opacity: 0.07;
            }
        }

        /* Speech Bubble */
        .mascot-speech-bubble {
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 14px;
            margin-top: 8px;
            border: 1px solid #334155;
            position: relative;
            animation: bubblePulse 3s infinite ease-in-out;
        }

        .mascot-speech-bubble::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 8px;
            height: 8px;
            background: #0f172a;
            border-top: 1px solid #334155;
            border-left: 1px solid #334155;
        }

        @keyframes bubblePulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        /* Button Hover Motion */
        .btn-error-primary {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-error-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35) !important;
        }

        .btn-error-secondary {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-error-secondary:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08) !important;
        }

        /* Quick Access Pills */
        .error-quick-pill {
            display: inline-flex;
            align-items: center;
            font-size: 0.72rem;
            font-weight: 600;
            color: #475569;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .error-quick-pill:hover {
            background: #ffffff;
            color: #2563eb;
            border-color: #bfdbfe;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
        }

        /* Dark Mode Compatibility */
        [data-theme="dark"] .error-404-card {
            background: #0f172a !important;
            border-color: #1e293b !important;
        }

        [data-theme="dark"] .hero-404-text {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        [data-theme="dark"] .mascot-speech-bubble {
            background: #1e293b;
            border-color: #334155;
            color: #f8fafc;
        }

        [data-theme="dark"] .mascot-speech-bubble::before {
            background: #1e293b;
            border-color: #334155;
        }

        [data-theme="dark"] .btn-error-secondary {
            background: #1e293b !important;
            color: #e2e8f0 !important;
            border-color: #334155 !important;
        }

        [data-theme="dark"] .btn-error-secondary:hover {
            background: #334155 !important;
            color: #ffffff !important;
        }

        [data-theme="dark"] .error-quick-pill {
            background: #1e293b;
            border-color: #334155;
            color: #cbd5e1;
        }

        [data-theme="dark"] .error-quick-pill:hover {
            background: #334155;
            color: #60a5fa;
            border-color: #60a5fa;
        }
    </style>

</body>

</html>
