<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/head :: head('Không tìm thấy trang (404)')}"></head>
<body class="bg-slate-50 min-h-screen d-flex align-items-center justify-content-center p-4">

    <div class="saas-card max-w-lg w-100 p-5 text-center shadow-xl border border-slate-100 rounded-3xl bg-white">
        <div class="w-16 h-16 rounded-2xl bg-amber-50 text-amber-600 d-inline-flex align-items-center justify-content-center text-2xl mb-4 shadow-xs">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <h1 class="text-2xl font-black text-slate-900 mb-2">404 - Không tìm thấy trang</h1>
        <p class="text-xs text-slate-500 mb-4 leading-relaxed">
            Liên kết bạn yêu cầu không tồn tại trên hệ thống TopicHub hoặc phiên đăng nhập của bạn đã hết hạn.
        </p>

        <div class="d-flex align-items-center justify-content-center gap-2.5">
            <a th:href="@{/dashboard}" class="btn bg-blue-600 hover:bg-blue-700 text-white rounded-xl px-4 py-2.5 text-xs font-semibold shadow-sm shadow-blue-500/20 d-inline-flex align-items-center gap-2 transition">
                <i class="fa-solid fa-house text-xs"></i>
                <span>Về Bảng điều khiển</span>
            </a>
            <a th:href="@{/login}" class="btn btn-light border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-slate-100 transition">
                <i class="fa-solid fa-arrow-right-to-bracket text-xs me-1"></i>
                <span>Đăng nhập lại</span>
            </a>
        </div>
    </div>

</body>
</html>
